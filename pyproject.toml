[project]
name = "framenet"
version = "0.1.0"
description = "FrameNet: Learning Local Canonical Frames of 3D Surfaces from a Single RGB Image"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26,<2.0",
    "scipy>=1.13",
    "scikit-image>=0.24",
    "opencv-python>=4.9",
    "tensorboardx>=2.6",
    "pillow>=10.0",
]

[tool.uv]
package = false
